name: Update prebuilt blobs

on:
  workflow_dispatch:
    inputs:
      device:
        description: Blob profile to update (all, a53xtfn, pa2qxxx-sdk37, etc.)
        type: string
        default: all
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.device || 'all' }}
  # A targeted manual retry must not cancel another firmware extraction.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - name: Checkout blob profile definitions only
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Select requested profiles
        id: profiles
        env:
          BLOB_DEVICE: ${{ inputs.device || 'all' }}
        run: python3 -B .github/blob_matrix.py --device "$BLOB_DEVICE" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    runs-on: ubuntu-24.04
    concurrency:
      group: blob-profile-${{ matrix.device }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Check One UI 9.0 firmware before downloading
        if: matrix.device == 'pa2qxxx-sdk37'
        id: blobs
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 -A 'samsung SM-S936B SyncML DM Client' \
            'https://fota-cloud-dn.ospserver.net/firmware/EUX/SM-S936B/version.xml' \
            --output "$RUNNER_TEMP/s936b-eux-version.xml"
          python3 -B .github/update_wallpaper_blobs.py \
            --feed "$RUNNER_TEMP/s936b-eux-version.xml" \
            --output-dir prebuilts/samsung/pa2qxxx-sdk37 >> "$GITHUB_OUTPUT"

      # Legacy rows have no blobs output. Skip expensive work only when the
      # existing One UI 9 receipt AND all split bytes match the advertised build.
      - name: Free disk space (1/3)
        if: steps.blobs.outputs.update != 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        if: steps.blobs.outputs.update != 'false'
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        if: steps.blobs.outputs.update != 'false'
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        if: steps.blobs.outputs.update != 'false'
        env:
          REQUIRE_F2FS: ${{ matrix.f2fs || false }}
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          # extract_fw uses fuse.erofs, not the kernel EROFS driver. Matching
          # Azure kernel packages need not exist in this runner image's APT repo.
          if ! grep -qw fuse /proc/filesystems; then
            sudo modprobe fuse
          fi
          if ! test -c /dev/fuse; then
            echo "::error::The firmware extractor requires a runner with /dev/fuse support." >&2
            exit 1
          fi
          # Native filesystem mounts are still checked by the real extractor.
          # This donor has a known F2FS system image; verify the real native
          # read-only mount path before downloading and unpacking its firmware.
          if [ "${REQUIRE_F2FS:-false}" = true ]; then
            sudo apt-get install -y --no-install-recommends f2fs-tools
            bash .github/prepare_f2fs.sh
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        if: steps.blobs.outputs.update != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        if: steps.blobs.outputs.update != 'false'
        run: |
          # The original sourced environment is checked separately.
          # shellcheck source=/dev/null
          source ./buildenv.sh a52sxq
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        if: steps.blobs.outputs.update != 'false'
        run: ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        if: steps.blobs.outputs.update != 'false'
        env:
          DEVICE: ${{ matrix.device }}
          FIRMWARE: ${{ matrix.firmware }}
          EXPECTED_FIRMWARE: ${{ steps.blobs.outputs.firmware }}
        run: |
          if [ "$DEVICE" = "pa2qxxx-sdk37" ]; then
            ./scripts/download_fw.sh --ignore-source --ignore-target "$FIRMWARE"
            ./scripts/extract_fw.sh --ignore-source --ignore-target "$FIRMWARE"
            AAPT2="$RUNNER_TEMP/wallpaper-blobs-aapt2"
            unzip -p "$TOOLS_DIR/bin/apktool.jar" prebuilt/linux/aapt2 > "$AAPT2"
            chmod 755 "$AAPT2"
            python3 .github/update_wallpaper_blobs.py \
              --firmware-dir "$FW_DIR/SM-S936B_EUX" \
              --output-dir "prebuilts/samsung/$DEVICE" --aapt2 "$AAPT2" \
              --expected-firmware "$EXPECTED_FIRMWARE"
          else
            ./scripts/internal/update_prebuilt_blobs.sh "$DEVICE" "$FIRMWARE"
          fi
          echo "PDA_BUILD=$(cut -d / -f 1 "prebuilts/samsung/$DEVICE/.current")" >> "$GITHUB_ENV"

      # The shallow checkout's base can advance during firmware extraction.
      # Negotiate shared objects rather than resending a multi-GiB base pack
      # when publishing a new profile branch. This does not change blob bytes.
      - name: Negotiate blob publication
        if: steps.blobs.outputs.update != 'false'
        run: git config --local push.negotiate true

      - name: Create Pull Request
        if: steps.blobs.outputs.update != 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            prebuilts/samsung/${{ matrix.device }}
          commit-message: 'prebuilts/samsung/${{ matrix.device }}: update blobs to ${{ env.PDA_BUILD }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/samsung/${{ matrix.device }}'
          delete-branch: true
          draft: ${{ matrix.device == 'pa2qxxx-sdk37' }}
          title: 'Update prebuilts/samsung/${{ matrix.device }} blobs to ${{ env.PDA_BUILD }}'
          body: |
            Refresh original firmware blobs for `${{ matrix.device }}`.

            The pa2qxxx-sdk37 profile accepts only genuine SM-S936B/EUX firmware
            reporting One UI 9 / One UI 90000, and a matching One UI 9 wallpaper resource
            package. Its receipt records the unchanged APK and split-part hashes.
            It does not replace the legacy pa2qxxx set or automatically update ROM
            consumers; review the new catalog/app contract before integration.
